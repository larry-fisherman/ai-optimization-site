<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for og-image.png (1200x630). Re-render after editing (see README).
       Hex values repeat css/tokens.css (XML comments can't hold a double hyphen, so the
       tokens are named without it): night #071A2E, Mist #E5E7EB (second line at the fg-soft
       alpha .66), Blue #3B82F6; the mark's gradient is the wordmark's. -->
  <defs>
    <style>
      @font-face { font-family: "Geist"; font-weight: 100 900; src: url("../fonts/Geist-Variable.woff2") format("woff2"); }
      .sans { font-family: "Geist", system-ui, sans-serif; }
    </style>
    <!-- the L mark: same paths and gradient as the wordmark in the shared header/footer -->
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset=".55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <!-- one soft Blue bloom, top-right; no rim -->
    <radialGradient id="bloom" cx="1010" cy="40" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#3B82F6" stop-opacity=".08"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#071A2E"/>
  <rect width="1200" height="630" fill="url(#bloom)"/>
  <!-- faint vertical grid: 6 columns between the 64px margins -->
  <g stroke="#E5E7EB" stroke-opacity=".05" stroke-width="1">
    <path d="M64.5 0V630M243.5 0V630M421.5 0V630M600.5 0V630M779.5 0V630M957.5 0V630M1136.5 0V630"/>
  </g>
  <!-- logo -->
  <g transform="translate(64 50) scale(.34)" fill="url(#mark)">
    <path d="M0 31C0 25.6 2.4 21.6 7 18.6L32.6 1.5C35 -.1 38 1.2 38 4.2V112C38 120.8 30.8 128 22 128H9C4 128 0 124 0 119Z"/>
    <path d="M39.6 128C36.5 128 34.6 124.9 36.2 122.3L52.8 94C54.2 91.5 55.8 90 58.7 90H108.6C111.1 90 112.5 92.7 111.1 94.7L93.4 124.6C92 127 90.6 128 87.6 128Z"/>
  </g>
  <text x="114" y="88" class="sans" font-size="38" font-weight="500" letter-spacing="-.8" fill="#E5E7EB">Legible</text>
  <!-- badge: a hairline pill with a Blue dot -->
  <rect x="64.5" y="196.5" width="226" height="43" rx="21.5" fill="#E5E7EB" fill-opacity=".04" stroke="#E5E7EB" stroke-opacity=".22"/>
  <circle cx="88" cy="218" r="5" fill="#3B82F6"/>
  <text x="104" y="225" class="sans" font-size="19" font-weight="400" fill="#E5E7EB">AI visibility studio</text>
  <!-- headline: Mist at 400; the second line lighter (300) and softer -->
  <text class="sans" font-size="74" letter-spacing="-3.3" fill="#E5E7EB">
    <tspan x="60" y="350" font-weight="400">Your website has a new reader.</tspan>
    <tspan x="60" y="436" font-weight="300" fill-opacity=".66">Make sure it understands you.</tspan>
  </text>
</svg>
